id: preprocessing.ica-blink
version: 1.0.0
title: Which component is the blink?
objective: Fit ICA on a rank-aware high-pass copy and remove the planted blink without erasing neural signal.
recipe: fixtures/recipes/ica-blink.json
controls:
  unlocked: [blink_amplitude_uv, sensor_noise_uv, reference, algorithm, component_count]
prediction_prompt: Which component is ocular, and what evidence supports your choice?
reveal_policy: deliberate
checkpoints:
