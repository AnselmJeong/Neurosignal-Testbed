<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Neurosignal Testbed</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #1d2433;
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
main { width: min(560px, 88vw); text-align: center; }
small { letter-spacing: .16em; color: #6b7385; font-weight: 600; }
h1 { font-size: 26px; margin: 10px 0 8px; letter-spacing: -.4px; }
p { margin: 0; color: #44506a; }
svg { width: 220px; height: 64px; margin: 18px auto 10px; display: block; }
path { fill: none; stroke: #2fb5a5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 420; stroke-dashoffset: 420; animation: trace 2.4s ease-in-out infinite; }
@keyframes trace { 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -420; } }
.hint { margin-top: 14px; font-size: 13px; color: #6b7385; }
@media (prefers-color-scheme: dark) { body { background: #151922; color: #e6e9ef; } p { color: #aab3c5; } }
</style>
</head>
<body>
<main>
  <small>NEUROSIGNAL TESTBED</small>
  <svg viewBox="0 0 220 64" aria-hidden="true"><path d="M4 32 H58 L68 14 L80 52 L92 6 L104 58 L114 32 H150 L158 24 L166 40 L174 32 H216"/></svg>
  <h1>분석 서버를 준비하고 있습니다</h1>
  <p>로컬 분석 엔진을 시작하는 중입니다. 잠시만 기다려 주세요.</p>
  <p class="hint">처음 실행할 때는 과학 계산 라이브러리 캐시를 만드느라 1~2분 정도 걸릴 수 있습니다.</p>
</main>
</body>
</html>
